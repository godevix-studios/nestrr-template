services:
  api:
    container_name: nestrr-api
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      WATCHPACK_POLLING: "true"
      # útil en Mac para file watching estable
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      - "9229:9229"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules