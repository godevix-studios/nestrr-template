services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - appnet
    # Cuando habilites DB:
    # depends_on:
    #   db:
    #     condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_HEALTH_URL: http://localhost:3000/api/health
    environment:
      PORT: 5173
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - appnet

  # Opcional para más adelante
